<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Lumora Aesthetic Dental</title>
  <meta name="robots" content="noindex, follow" />

  <style>
    :root {
      --color-bg-base: #0c0c0e;
      --color-text-primary: #f3f1ec;
      --color-text-secondary: #a8a49c;
      --color-gold-warm: #c9a24b;
      --color-gold-bright: #e3bd6a;
      --color-gold-muted: #9c8250;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      background-color: var(--color-bg-base);
      color: var(--color-text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,162,75,.18), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .wrap { position: relative; max-width: 560px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--color-gold-muted);
      margin-bottom: 1.5rem;
    }
    .eyebrow__line { display: block; width: 26px; height: 1px; background: var(--color-gold-muted); }
    .code {
      font-size: clamp(4rem, 14vw, 7rem);
      font-weight: 200;
      letter-spacing: -.02em;
      line-height: 1;
      color: var(--color-gold-warm);
    }
    h1 {
      margin-top: 1.25rem;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 300;
      line-height: 1.3;
    }
    p {
      margin-top: .9rem;
      font-size: .95rem;
      line-height: 1.7;
      color: var(--color-text-secondary);
    }
    .actions {
      margin-top: 2.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      border-radius: 6px;
      padding: .85rem 1.9rem;
      text-decoration: none;
      transition: transform .3s ease, box-shadow .3s ease, background .3s ease, color .3s ease;
    }
    .btn--primary { background: var(--color-gold-warm); color: var(--color-bg-base); }
    .btn--primary:hover { background: var(--color-gold-bright); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,162,75,.35); }
    .btn--ghost { background: transparent; color: var(--color-text-secondary); border: 1px solid rgba(201,162,75,.35); }
    .btn--ghost:hover { border-color: var(--color-gold-warm); color: var(--color-gold-warm); transform: translateY(-2px); }
    .logo { margin-top: 3rem; font-size: .8rem; color: var(--color-text-secondary); letter-spacing: .04em; }
    .logo strong { color: var(--color-text-primary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="wrap">
    <p class="eyebrow"><span class="eyebrow__line"></span>Error 404</p>
    <div class="code">404</div>
    <h1>This page has stepped out of the chair.</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to a smile-worthy destination.</p>

    <div class="actions">
      <a href="/" class="btn btn--primary">Back to Homepage</a>
      <a href="/#contact" class="btn btn--ghost">Contact Us</a>
    </div>

    <p class="logo"><strong>Lumora Aesthetic Dental</strong> · Cosmetic &amp; Implant Dentistry, New Cairo</p>
  </div>
</body>
</html>
